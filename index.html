<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuAuto | Open Chat Global en Tiempo Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Version Compat para fácil integración) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #171717;
            --surface: #14222b;
            --surface2: #192a34;
            --border: #283b46;
            --orange: #c96c02;
            --orange-soft: rgba(201, 108, 2, 0.18);
            --text: #f5f8fa;
            --text2: #bac8cf;
            --radius: 14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            background: #090e13;
            border-bottom: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--orange);
            color: #fff;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-weight: 900;
        }

        .user-tag {
            font-size: 12px;
            background: var(--surface2);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #36cf8b;
            border-radius: 50%;
        }

        .container {
            width: min(800px, 94%);
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 800;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d151c;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: var(--orange);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            margin-right: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .meta {
            display: block;
            font-size: 10px;
            opacity: 0.75;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .time {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-area {
            padding: 15px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090e13;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            border-color: var(--orange);
        }

        .btn-send {
            padding: 12px 24px;
            background: var(--orange);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        @media(max-width: 600px) {
            .container { width: 100%; margin: 0; }
            .chat-card { height: calc(100vh - 70px); border-radius: 0; border: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-mark">TA</div>
        TuAuto Open Chat
    </div>
    <div class="user-tag">
        <div class="status-dot"></div>
        <span id="displayUser">Conectando...</span>
    </div>
</header>

<main class="container">
    <div class="chat-card">
        <div class="chat-header">
            <h2>💬 Sala Pública Global de Pruebas</h2>
            <span style="font-size: 11px; color: var(--text2);">Tiempo Real Activo</span>
        </div>

        <div class="messages-container" id="messagesList">
            <!-- Mensajes en tiempo real se cargan aquí -->
        </div>

        <form class="chat-input-area" onsubmit="sendMessage(event)">
            <input type="text" id="msgInput" placeholder="Escribí un mensaje público..." autocomplete="off" required>
            <button type="submit" class="btn-send">Enviar</button>
        </form>
    </div>
</main>

<script>
    // 1. Configuración de Firebase Realtime Database pública para pruebas
    const firebaseConfig = {
        databaseURL: "https://tuauto-demo-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("global_open_chat");

    // 2. Generar un Nombre/ID de Usuario único para esta computadora/navegador
    let myUser = localStorage.getItem('tuauto_chat_username');
    if (!myUser) {
        myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('tuauto_chat_username', myUser);
    }
    document.getElementById('displayUser').innerText = myUser;

    // 3. Enviar mensaje a Firebase
    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chatRef.push({
                user: myUser,
                text: text,
                time: timeStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
        }
    }

    // 4. Escuchar mensajes en Tiempo Real (Sincronización instantánea entre PCs)
    chatRef.limitToLast(100).on('child_added', (snapshot) => {
        const data = snapshot.val();
        appendMessage(data);
    });

    // 5. Renderizar mensaje en pantalla
    function appendMessage(data) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        const isMine = data.user === myUser;

        msgDiv.className = `message ${isMine ? 'mine' : 'other'}`;
        msgDiv.innerHTML = `
            <span class="meta">${escapeHTML(data.user)}</span>
            ${escapeHTML(data.text)}
            <span class="time">${data.time || ''}</span>
        `;

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    // Función de seguridad para evitar inyección de HTML
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>

</body>
</html>
