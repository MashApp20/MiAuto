<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuAuto | Sala Global en Tiempo Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PeerJS oficial para conexión P2P real entre dispositivos sin servidor -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #171717;
            --surface: #14222b;
            --surface2: #192a34;
            --border: #283b46;
            --orange: #c96c02;
            --green: #36cf8b;
            --text: #f5f8fa;
            --text2: #bac8cf;
            --radius: 14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            background: #090e13;
            border-bottom: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--orange);
            color: #fff;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-weight: 900;
        }

        .user-tag {
            font-size: 12px;
            background: var(--surface2);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
        }
        .status-dot.active {
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .container {
            width: min(850px, 94%);
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 450px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d151c;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: var(--orange);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            margin-right: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            margin: 4px auto;
            background: rgba(255,255,255,0.05);
            color: var(--text2);
            font-size: 11px;
            text-align: center;
            border-radius: 20px;
            padding: 5px 14px;
        }

        .meta {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .time {
            font-size: 9px;
            opacity: 0.65;
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-area {
            padding: 15px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090e13;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .btn-send {
            padding: 12px 24px;
            background: var(--orange);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        @media(max-width: 600px) {
            .container { width: 100%; margin: 0; }
            .chat-card { height: calc(100vh - 70px); border-radius: 0; border: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-mark">TA</div>
        TuAuto Open Chat
    </div>
    <div class="user-tag">
        <div class="status-dot" id="statusDot"></div>
        <span id="displayUser">Conectando...</span>
    </div>
</header>

<main class="container">
    <div class="chat-card">
        <div class="chat-header">
            <h2 style="font-size: 15px; font-weight: 800;">🌐 Sala Pública Multidispositivo</h2>
            <span style="font-size: 11px; color: var(--text2);" id="connectionStatus">Estableciendo red...</span>
        </div>

        <div class="messages-container" id="messagesList">
            <div class="message system">🔄 Conectando a la red global de dispositivos...</div>
        </div>

        <form class="chat-input-area" onsubmit="sendMessage(event)">
            <input type="text" id="msgInput" placeholder="Escribí un mensaje..." autocomplete="off" required>
            <button type="submit" class="btn-send">Enviar</button>
        </form>
    </div>
</main>

<script>
    // ID Fijo de la Sala Pública Global
    const GLOBAL_ROOM_ID = "tuauto-public-room-v1";
    
    // Generar Apodo Aleatorio para esta PC/Celular
    let myUser = localStorage.getItem('tuauto_nick');
    if (!myUser) {
        myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('tuauto_nick', myUser);
    }
    document.getElementById('displayUser').innerText = myUser;

    let peer = null;
    let connections = []; // Guarda las conexiones activas con otros celus/PCs

    function initChatNetwork() {
        // Intentar registrarse como el HOST (Servidor principal temporal) de la sala
        peer = new Peer(GLOBAL_ROOM_ID);

        peer.on('open', (id) => {
            console.log("Servidor principal de sala iniciado.");
            updateStatus("🟢 Sala activa (Sos el primer usuario)");
            addSystemMsg("Te conectaste como anfitrión de la sala. Otros celulares y PCs se unirán automáticamente al ingresar a la web.");
        });

        // Escuchar conexiones entrantes de otros celulares o PCs
        peer.on('connection', (conn) => {
            setupConnection(conn);
            addSystemMsg("📱/💻 Un nuevo dispositivo se unió a la conversación.");
        });

        // Si la ID del Host ya está ocupada por otro usuario en la red, nos conectamos a él como Cliente
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                console.log("Ya hay una sala activa. Conectando a la sala...");
                peer = new Peer(); // Genera ID de cliente automático
                
                peer.on('open', () => {
                    const conn = peer.connect(GLOBAL_ROOM_ID);
                    setupConnection(conn);
                });
            } else {
                console.error(err);
            }
        });
    }

    function setupConnection(conn) {
        connections.push(conn);

        conn.on('open', () => {
            updateStatus("🟢 Conectado en tiempo real con otros dispositivos");
        });

        conn.on('data', (data) => {
            // Recibir mensaje enviado por otro celular/PC
            appendMessage(data.user, data.text, false, data.time);

            // Si soy el Host, retransmito el mensaje a todos los demás dispositivos conectados
            if (peer.id === GLOBAL_ROOM_ID) {
                connections.forEach(c => {
                    if (c !== conn && c.open) {
                        c.send(data);
                    }
                });
            }
        });

        conn.on('close', () => {
            connections = connections.filter(c => c !== conn);
            addSystemMsg("Un dispositivo se desconectó.");
        });
    }

    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const payload = {
                user: myUser,
                text: text,
                time: timeStr
            };

            // Enviar mensaje a todas las PCs / celulares conectados
            connections.forEach(c => {
                if (c.open) c.send(payload);
            });

            // Mostrar el mensaje en mi propia pantalla
            appendMessage(myUser, text, true, timeStr);
            input.value = '';
