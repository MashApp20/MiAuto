<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuAuto | Chat Global Automático</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PeerJS para conexión directa P2P real -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #171717;
            --surface: #14222b;
            --surface2: #192a34;
            --border: #283b46;
            --orange: #c96c02;
            --green: #36cf8b;
            --red: #ef6262;
            --text: #f5f8fa;
            --text2: #bac8cf;
            --radius: 14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            background: #090e13;
            border-bottom: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--orange);
            color: #fff;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-weight: 900;
        }

        .user-tag {
            font-size: 12px;
            background: var(--surface2);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-tag:hover {
            border-color: var(--orange);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #f39a24;
            border-radius: 50%;
        }
        .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .container {
            width: min(850px, 94%);
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 450px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d151c;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: var(--orange);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            margin-right: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            margin: 4px auto;
            background: rgba(255,255,255,0.06);
            color: var(--text2);
            font-size: 11px;
            text-align: center;
            border-radius: 20px;
            padding: 5px 14px;
        }

        .meta {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .time {
            font-size: 9px;
            opacity: 0.65;
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-area {
            padding: 15px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090e13;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .btn-send {
            padding: 12px 24px;
            background: var(--orange);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        @media(max-width: 600px) {
            .container { width: 100%; margin: 0; }
            .chat-card { height: calc(100vh - 70px); border-radius: 0; border: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-mark">TA</div>
        TuAuto Chat Libre
    </div>
    <div class="user-tag" onclick="changeNickname()" title="Hacé clic para cambiar tu apodo">
        <div class="status-dot" id="statusDot"></div>
        <span id="displayUser">Conectando...</span> ✏️
    </div>
</header>

<main class="container">
    <div class="chat-card">
        <div class="chat-header">
            <h2 style="font-size: 15px; font-weight: 800;">🌐 Sala Global Automática</h2>
            <span style="font-size: 11px; color: var(--text2);" id="netStatus">Buscando dispositivos...</span>
        </div>

        <messages class="messages-container" id="messagesList">
            <div class="message system">🔄 Iniciando red automática P2P...</div>
        </messages>

        <form class="chat-input-area" onsubmit="sendMessage(event)">
            <input type="text" id="msgInput" placeholder="Escribí un mensaje..." autocomplete="off" disabled required>
            <button type="submit" class="btn-send" id="sendBtn" disabled>Enviar</button>
        </form>
    </div>
</main>

<script>
    // 1. Apodo del usuario automático o editable
    let myUser = localStorage.getItem('tuauto_nickname');
    if (!myUser) {
        myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('tuauto_nickname', myUser);
    }
    document.getElementById('displayUser').innerText = myUser;

    function changeNickname() {
        const nuevo = prompt("Elegí tu nuevo apodo:", myUser);
        if (nuevo && nuevo.trim() !== "") {
            const old = myUser;
            myUser = nuevo.trim();
            localStorage.setItem('tuauto_nickname', myUser);
            document.getElementById('displayUser').innerText = myUser;
            broadcast({ type: 'system', text: `🔄 ${old} cambió su apodo a ${myUser}` });
        }
    }

    // 2. Conexión automática por ID maestro fijo en la red P2P
    const MASTER_ROOM_ID = "tuauto-sala-global-central-2026";
    let peer = null;
    let activeConnections = [];
    let isHost = false;

    function initAutoConnect() {
        // Intentar crear la sala como Host principal
        peer = new Peer(MASTER_ROOM_ID);

        peer.on('open', (id) => {
            isHost = true;
            setOnlineStatus("🟢 Conectado (Anfitrión de sala)");
            addSystemMsg("🟢 Te uniste a la sala global automáticamente.");
            enableChat(true);
        });

        // Si el ID ya existe (porque otro dispositivo ya entró primero), nos convertimos en Cliente automáticamente
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                isHost = false;
                peer = new Peer(); // Creamos Peer libre para conectarnos al Host
                
                peer.on('open', (myId) => {
                    const conn = peer.connect(MASTER_ROOM_ID);
                    setupConnection(conn);
                    setOnlineStatus("🟢 Conectado a la sala");
                    addSystemMsg("🟢 Te conectaste a la sala global automáticamente.");
                    enableChat(true);
                });
            } else {
                setOnlineStatus("🔴 Error de red");
            }
        });

        // Si somos Host, escuchamos cuando otros entran
        peer.on('connection', (conn) => {
            setupConnection(conn);
            addSystemMsg("📱 Alguien se conectó a la sala.");
        });
    }

    function setupConnection(conn) {
        if (!activeConnections.includes(conn)) {
            activeConnections.push(conn);
        }

        conn.on('data', (data) => {
            if (data.type === 'chat') {
                appendMessage(data.user, data.text, false, data.time);
                
                // Si somos el Host, retransmitimos el mensaje a los demás conectados para que todos se hablen con todos
                if (isHost) {
                    activeConnections.forEach(c => {
                        if (c !== conn && c.open) c.send(data);
                    });
                }
            } else if (data.type === 'system') {
                addSystemMsg(data.text);
                if (isHost) {
                    activeConnections.forEach(c => {
                        if (c !== conn && c.open) c.send(data);
                    });
                }
            }
        });

        conn.on('close', () => {
            activeConnections = activeConnections.filter(c => c !== conn);
        });
    }

    function broadcast(dataObj) {
        activeConnections.forEach(c => {
            if (c.open) c.send(dataObj);
        });
    }

    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const payload = {
                type: 'chat',
                user: myUser,
                text: text,
                time: timeStr
            };

            broadcast(payload);
            appendMessage(myUser, text, true, timeStr);
            input.value = '';
        }
    }

    function appendMessage(user, text, isMine, time) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'mine' : 'other'}`;
        msgDiv.innerHTML = `
            <span class="meta">${escapeHTML(user)}</span>
            ${escapeHTML(text)}
            <span class="time">${time || ''}</span>
        `;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function addSystemMsg(text) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message system';
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function setOnlineStatus(text) {
        document.getElementById('statusDot').classList.add('online');
        document.getElementById('netStatus').innerText = text;
    }

    function enableChat(enable) {
        document.getElementById('msgInput').disabled = !enable;
        document.getElementById('sendBtn').disabled = !enable;
        if(enable) document.getElementById('msgInput').focus();
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }

    // Arrancar automáticamente al cargar la página
    window.onload = initAutoConnect;
</script>

</body>
</html>
