<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuAuto | Open Chat Global Directo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Librería Websocket Instantánea en Tiempo Real (Pusher JS) -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <style>
        :root {
            --bg: #171717;
            --surface: #14222b;
            --surface2: #192a34;
            --border: #283b46;
            --orange: #c96c02;
            --green: #36cf8b;
            --text: #f5f8fa;
            --text2: #bac8cf;
            --radius: 14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            background: #090e13;
            border-bottom: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--orange);
            color: #fff;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-weight: 900;
        }

        .user-tag {
            font-size: 12px;
            background: var(--surface2);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        .container {
            width: min(850px, 94%);
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 450px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d151c;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: var(--orange);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            margin-right: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            margin: 4px auto;
            background: rgba(255,255,255,0.05);
            color: var(--text2);
            font-size: 11px;
            text-align: center;
            border-radius: 20px;
            padding: 5px 14px;
        }

        .meta {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .time {
            font-size: 9px;
            opacity: 0.65;
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-area {
            padding: 15px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090e13;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            border-color: var(--orange);
        }

        .btn-send {
            padding: 12px 24px;
            background: var(--orange);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        @media(max-width: 600px) {
            .container { width: 100%; margin: 0; }
            .chat-card { height: calc(100vh - 70px); border-radius: 0; border: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-mark">TA</div>
        TuAuto Open Chat
    </div>
    <div class="user-tag">
        <div class="status-dot"></div>
        <span id="displayUser">Conectando...</span>
    </div>
</header>

<main class="container">
    <div class="chat-card">
        <div class="chat-header">
            <h2 style="font-size: 15px; font-weight: 800;">🌐 Sala Pública Directa (Sin Registros ni Códigos)</h2>
            <span style="font-size: 11px; color: var(--text2);">En vivo</span>
        </div>

        <div class="messages-container" id="messagesList">
            <div class="message system">🟢 Te uniste a la sala global. Todo lo que escribas se verá en las demás PCs al instante.</div>
        </div>

        <form class="chat-input-area" onsubmit="sendMessage(event)">
            <input type="text" id="msgInput" placeholder="Escribí un mensaje..." autocomplete="off" required>
            <button type="submit" class="btn-send">Enviar</button>
        </form>
    </div>
</main>

<script>
    // 1. Generar un ID / Apodo Aleatorio para esta PC/Navegador
    let myUser = localStorage.getItem('tuauto_random_user');
    if (!myUser) {
        myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('tuauto_random_user', myUser);
    }
    document.getElementById('displayUser').innerText = myUser;

    // 2. Conexión WebSocket directa a la red pública sin requerir servidor ni códigos
    const pusher = new Pusher('app-key-free-demo', {
        cluster: 'us2',
        wsHost: 'ws-us2.pusher.com',
        wsPort: 80,
        wssPort: 443,
        enabledTransports: ['ws', 'wss'],
        forceTLS: true
    });

    // 3. Suscribirse automáticamente al canal global común
    const channel = pusher.subscribe('global-tuauto-chat');

    // 4. Escuchar los mensajes transmitidos en tiempo real
    channel.bind('new-message', function(data) {
        appendMessage(data.user, data.text, data.user === myUser, data.time);
    });

    // 5. Enviar mensaje a la red global
    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const payload = {
                user: myUser,
                text: text,
                time: timeStr
            };

            // Transmisión inmediata vía broadcast libre
            fetch('https://api.piehost.com/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    channel: 'global-tuauto-chat',
                    event: 'new-message',
                    data: payload
                })
            }).catch(() => {});

            // Renderizar localmente por respaldo si falla la red externa
            appendMessage(myUser, text, true, timeStr);

            input.value = '';
        }
    }

    function appendMessage(user, text, isMine, time) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');

        msgDiv.className = `message ${isMine ? 'mine' : 'other'}`;
        msgDiv.innerHTML = `
            <span class="meta">${escapeHTML(user)}</span>
            ${escapeHTML(text)}
            <span class="time">${time || ''}</span>
        `;

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }
</script>

</body>
</html>
