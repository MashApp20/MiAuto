
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TuAuto | Chat P2P</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
    --bg:#121212;
    --panel:#1b1b1b;
    --border:#303030;
    --orange:#c96c02;
    --text:#f5f5f5;
    --muted:#999;
}
* { box-sizing:border-box; }
body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    height:100dvh;
    display:flex;
    flex-direction:column;
}
header {
    padding:18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo { font-weight:800;font-size:19px; }
.logo span { color:var(--orange); }
#status { color:var(--muted);font-size:12px; }
main {
    width:min(700px,100%);
    margin:auto;
    padding:14px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}
.chat {
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}
.chat-title {
    padding:16px;
    border-bottom:1px solid var(--border);
    font-weight:bold;
}
#messages {
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.msg {
    max-width:85%;
    padding:12px 15px;
    border-radius:15px;
    overflow-wrap:anywhere;
    background:#292929;
    align-self:flex-start;
    line-height:1.45;
}
.msg.mine {
    background:var(--orange);
    align-self:flex-end;
}
.msg .author {
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    opacity:.8;
}
.msg time {
    display:block;
    font-size:10px;
    text-align:right;
    opacity:.7;
    margin-top:6px;
}
.msg audio { max-width:100%;width:240px; }
.system {
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:8px;
}
.composer {
    padding:14px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:10px;
}
.row {
    display:flex;
    gap:9px;
}
input[type=text] {
    flex:1;
    min-width:0;
    padding:14px;
    background:#101010;
    border:1px solid var(--border);
    border-radius:12px;
    color:white;
    outline:none;
    font-size:15px;
}
input:focus { border-color:var(--orange); }
button {
    border:0;
    border-radius:11px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
    background:var(--orange);
    color:white;
}
button:disabled,input:disabled {
    opacity:.4;
    cursor:not-allowed;
}
.secondary {
    background:#303030;
}
#voiceControls {
    display:none;
    gap:8px;
}
#voiceControls.visible { display:flex; }
#voiceControls button { flex:1; }
#turnStatus {
    font-size:12px;
    text-align:center;
    color:var(--muted);
    min-height:15px;
}
@media(max-width:500px) {
    main { padding:0; }
    .chat { border-radius:0;border:0; }
    header { padding:15px; }
    .msg audio { width:200px; }
}
</style>
</head>
<body>

<header>
    <div class="logo"><span>TuAuto</span> Chat</div>
    <div id="status">Conectando...</div>
</header>

<main>
<div class="chat">
    <div class="chat-title">Chat privado P2P</div>

    <div id="messages">
        <div class="system">
            Iniciando conexión. Esperá a que la sala esté disponible.
        </div>
    </div>

    <div class="composer">
        <div id="turnStatus">Conectando a la sala...</div>

        <form class="row" id="chatForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Escribí un mensaje..."
                autocomplete="off"
                disabled
            >
            <button id="sendButton" type="submit" disabled>
                Enviar
            </button>
        </form>

        <div class="row" id="voiceControls">
            <button type="button" id="cancelVoice" class="secondary">
                Cancelar
            </button>
            <button type="button" id="sendVoice">
                Enviar audio
            </button>
        </div>

        <button type="button" id="recordButton" class="secondary" disabled>
            🎙️ Grabar nota de voz
        </button>
    </div>
</div>
</main>

<script>
const ROOM_ID = "tuauto-global-mesh-room-2026";
const MAX_MESSAGES = 3;

let myUser = localStorage.getItem("tuauto_nick_2026");

if (!myUser) {
    myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem("tuauto_nick_2026", myUser);
}

let peer = null;
let isHost = false;
let connections = [];
let sentCount = 0;
let connected = false;

let recorder = null;
let recordingStream = null;
let audioChunks = [];
let pendingAudio = null;

const $ = id => document.getElementById(id);

function systemMessage(text) {
    const el = document.createElement("div");
    el.className = "system";
    el.textContent = text;
    $("messages").appendChild(el);
    scrollDown();
}

function scrollDown() {
    $("messages").scrollTop = $("messages").scrollHeight;
}

function updateControls() {
    const allowed = connected && sentCount < MAX_MESSAGES;

    $("messageInput").disabled = !allowed;
    $("sendButton").disabled = !allowed;
    $("recordButton").disabled = !allowed || !!recorder;

    if (!connected) {
        $("turnStatus").textContent = "Conectando a la sala...";
    } else if (sentCount >= MAX_MESSAGES) {
        $("turnStatus").textContent =
            "Esperando que la otra persona responda...";
    } else {
        $("turnStatus").textContent = "Podés enviar tu mensaje.";
    }
}

function setConnected() {
    connected = true;
    $("status").textContent = "● Conectado";
    updateControls();
}

function addMessage(user, content, mine, type = "text") {
    const box = document.createElement("div");
    box.className = "msg" + (mine ? " mine" : "");

    const author = document.createElement("span");
    author.className = "author";
    author.textContent = user;
    box.appendChild(author);

    if (type === "audio") {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = content;
        box.appendChild(audio);
    } else {
        const text = document.createElement("div");
        text.textContent = content;
        box.appendChild(text);
    }

    const time = document.createElement("time");
    time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
    box.appendChild(time);

    $("messages").appendChild(box);
    scrollDown();
}

// El host retransmite los datos a los demás participantes.
function broadcast(data, except = null) {
    connections.forEach(conn => {
        if (conn !== except && conn.open) {
            try {
                conn.send(data);
            } catch (err) {
                console.error("Error enviando datos:", err);
            }
        }
    });
}

function setupConnection(conn) {
    if (connections.includes(conn)) return;
    connections.push(conn);

    conn.on("open", () => {
        setConnected();
    });

    conn.on("data", data => {
        // El host retransmite el mensaje sin duplicar el envío al origen.
        if (isHost) broadcast(data, conn);

        if (data.type === "chat") {
            // Cualquier mensaje recibido del otro lado habilita
            // un nuevo turno de tres mensajes.
            sentCount = 0;
            addMessage(data.user, data.text, false);
            updateControls();
        }

        if (data.type === "audio") {
            sentCount = 0;
            addMessage(data.user, data.audio, false, "audio");
            updateControls();
        }
    });

    conn.on("close", () => {
        connections = connections.filter(c => c !== conn);
        if (connections.length === 0) {
            connected = false;
            $("status").textContent = "Desconectado";
            updateControls();
        }
    });

    conn.on("error", err => {
        console.error("Error de conexión:", err);
    });
}

function initChat() {
    try {
        peer = new Peer(ROOM_ID);

        peer.on("open", () => {
            isHost = true;
            setConnected();
            systemMessage("Sala iniciada. Esperando a otra persona.");
        });

        peer.on("connection", conn => {
            setupConnection(conn);
            systemMessage("Un usuario se conectó.");
        });

        peer.on("error", err => {
            if (err.type === "unavailable-id") {
                // La sala ya existe: ingresar como participante.
                peer = new Peer();

                peer.on("open", () => {
                    const conn = peer.connect(ROOM_ID, {
                        reliable: true
                    });
                    setupConnection(conn);
                    conn.on("open", () => {
                        setConnected();
                        systemMessage("Conectado a la sala.");
                    });
                });

                peer.on("error", error => {
                    console.error(error);
                    $("status").textContent = "Error de conexión";
                });
            } else {
                console.error(err);
                $("status").textContent = "Error de red";
            }
        });
    } catch (err) {
        console.error(err);
        $("status").textContent = "No se pudo conectar";
    }
}

function sendPayload(payload) {
    if (!connected || sentCount >= MAX_MESSAGES) return false;

    // El envío se cuenta una sola vez en el dispositivo emisor.
    sentCount++;
    broadcast(payload);

    if (payload.type === "chat") {
        addMessage(myUser, payload.text, true);
    } else if (payload.type === "audio") {
        addMessage(myUser, payload.audio, true, "audio");
    }

    updateControls();
    return true;
}

$("chatForm").addEventListener("submit", event => {
    event.preventDefault();

    const input = $("messageInput");
    const text = input.value.trim();

    if (!text || sentCount >= MAX_MESSAGES) return;

    if (sendPayload({
        type: "chat",
        user: myUser,
        text
    })) {
        input.value = "";
        input.focus();
    }
});

// Notas de voz
$("recordButton").addEventListener("click", async () => {
    if (!connected || sentCount >= MAX_MESSAGES || recorder) return;

    try {
        recordingStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        const mimeType = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4"
        ].find(type => MediaRecorder.isTypeSupported(type));

        recorder = mimeType
            ? new MediaRecorder(recordingStream, { mimeType })
            : new MediaRecorder(recordingStream);

        audioChunks = [];

        recorder.ondataavailable = event => {
            if (event.data.size) audioChunks.push(event.data);
        };

        recorder.onstop = () => {
            pendingAudio = new Blob(audioChunks, {
                type: recorder?.mimeType || "audio/webm"
            });

            $("voiceControls").classList.add("visible");
            $("recordButton").style.display = "none";
            releaseRecordingStream();
        };

        recorder.start();
        $("recordButton").textContent = "🔴 Grabando... Tocá para terminar";
        $("recordButton").disabled = false;

        // Segundo toque: finalizar grabación y preparar el audio.
        $("recordButton").onclick = () => {
            if (recorder && recorder.state === "recording") {
                recorder.stop();
            }
        };
    } catch (err) {
        console.error(err);
        alert("No se pudo acceder al micrófono. Revisá los permisos.");
        releaseRecordingStream();
        recorder = null;
        updateControls();
    }
});

function releaseRecordingStream() {
    if (recordingStream) {
        recordingStream.getTracks().forEach(track => track.stop());
        recordingStream = null;
    }
}

$("sendVoice").addEventListener("click", async () => {
    if (!pendingAudio || sentCount >= MAX_MESSAGES) return;

    // Límite preventivo para evitar mensajes de datos demasiado grandes.
    if (pendingAudio.size > 1024 * 1024) {
        alert("El audio supera 1 MB. Grabá una nota más corta.");
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        sendPayload({
            type: "audio",
            user: myUser,
            audio: reader.result
        });

        pendingAudio = null;
        $("voiceControls").classList.remove("visible");
        $("recordButton").style.display = "";
        $("recordButton").textContent = "🎙️ Grabar nota de voz";
        $("recordButton").onclick = null;
        recorder = null;
        updateControls();
    };

    reader.readAsDataURL(pendingAudio);
});

$("cancelVoice").addEventListener("click", () => {
    if (recorder && recorder.state === "recording") {
        recorder.onstop = null;
        recorder.stop();
    }

    releaseRecordingStream();
    pendingAudio = null;
    audioChunks = [];
    recorder = null;

    $("voiceControls").classList.remove("visible");
    $("recordButton").style.display = "";
    $("recordButton").textContent = "🎙️ Grabar nota de voz";
    $("recordButton").onclick = null;

    updateControls();
});

// El primer toque inicia la grabación; el segundo la finaliza.
$("recordButton").addEventListener("click", () => {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }
});

initChat();
</script>
</body>
</html>
