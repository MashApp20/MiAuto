<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuAuto | Next-Gen P2P Chat 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PeerJS oficial para transmisión P2P real de mensajes y archivos -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #121212;
            --surface: #171717;
            --surface2: #212121;
            --surface3: #2a2a2a;
            --border: #2e2e2e;
            --orange: #c96c02;
            --orange-glow: rgba(201, 108, 2, 0.35);
            --green: #36cf8b;
            --green-glow: rgba(54, 207, 139, 0.35);
            --red: #ef6262;
            --text: #f5f8fa;
            --text2: #a0aab0;
            --radius: 16px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(201,108,2,0.06) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            height: 72px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--orange), #9e5300);
            color: #fff;
            display: grid;
            place-items: center;
            border-radius: 12px;
            font-weight: 900;
            box-shadow: 0 4px 20px var(--orange-glow);
        }

        .user-tag {
            font-size: 13px;
            background: var(--surface2);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }

        .user-tag:hover {
            border-color: var(--orange);
            box-shadow: 0 0 15px var(--orange-glow);
            transform: translateY(-1px);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #666;
            border-radius: 50%;
            transition: var(--transition);
        }
        .status-dot.online { 
            background: var(--green); 
            box-shadow: 0 0 10px var(--green-glow); 
        }

        .container {
            width: min(900px, 94%);
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 520px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .chat-header {
            padding: 16px 24px;
            background: rgba(33, 33, 33, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .net-status {
            font-size: 12px;
            color: var(--text2);
            font-weight: 500;
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #141414;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--surface3);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.mine {
            margin-left: auto;
            background: linear-gradient(135deg, var(--orange), #aa5800);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px var(--orange-glow);
        }

        .message.other {
            margin-right: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.system {
            margin: 6px auto;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text2);
            font-size: 12px;
            text-align: center;
            border-radius: 30px;
            padding: 6px 18px;
            max-width: 90%;
        }

        .meta {
            display: block;
            font-size: 11px;
            opacity: 0.85;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .time {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 6px;
            text-align: right;
            display: block;
        }

        /* Elementos Multimedia en Burbujas */
        .chat-media-img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            margin-top: 6px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
            transition: var(--transition);
        }
        .chat-media-img:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .chat-media-video {
            width: 100%;
            max-width: 360px;
            border-radius: 12px;
            margin-top: 6px;
            outline: none;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chat-file-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }
        .chat-file-card:hover {
            background: rgba(0,0,0,0.4);
        }

        .file-icon-box {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 18px;
        }

        /* Reproductor de Nota de Voz Custom */
        .audio-player-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.2);
            padding: 10px 14px;
            border-radius: 24px;
            margin-top: 6px;
            min-width: 220px;
        }
        .audio-play-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 0;
            background: var(--text);
            color: var(--bg);
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 900;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .message.mine .audio-play-btn {
            background: #fff;
            color: var(--orange);
        }
        .audio-wave-visual {
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .wave-bar {
            flex: 1;
            background: rgba(255,255,255,0.3);
            height: 30%;
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        /* Footer & Controles de Entrada */
        .chat-input-wrapper {
            padding: 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            position: relative;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #0d0d0d;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: var(--transition);
        }

        .chat-input-area input[type="text"]:focus {
            border-color: var(--orange);
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .action-btn {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .action-btn:hover {
            border-color: var(--orange);
            color: var(--orange);
            background: var(--surface3);
        }

        .btn-send {
            padding: 0 24px;
            height: 46px;
            background: linear-gradient(135deg, var(--orange), #a35500);
            color: #fff;
            border: 0;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--orange-glow);
        }

        .btn-send:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        /* Menú Flotante de Adjuntos 2026 */
        .attach-menu {
            position: absolute;
            bottom: 78px;
            left: 20px;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px) scale(0.95);
            transition: var(--transition);
            z-index: 40;
            min-width: 200px;
        }

        .attach-menu.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .attach-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            font-weight: 600;
        }

        .attach-item:hover {
            background: var(--surface3);
            color: var(--orange);
        }

        .attach-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            display: grid;
            place-items: center;
            font-size: 16px;
        }

        /* Barra / Interfaz de Grabación de Voz */
        .voice-rec-bar {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--surface);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .voice-rec-bar.active {
            opacity: 1;
            pointer-events: all;
        }

        .rec-dot {
            width: 12px;
            height: 12px;
            background: var(--red);
            border-radius: 50%;
            animation: pulseRec 1s infinite alternate;
        }

        @keyframes pulseRec {
            from { opacity: 0.3; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.25); box-shadow: 0 0 12px var(--red); }
        }

        .rec-timer {
            font-weight: 700;
            font-size: 14px;
            font-mono: monospace;
            color: var(--text);
            min-width: 48px;
        }

        .wave-canvas {
            flex: 1;
            height: 36px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .btn-cancel-rec {
            background: rgba(239, 98, 98, 0.15);
            color: var(--red);
            border: 1px solid rgba(239, 98, 98, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-cancel-rec:hover {
            background: var(--red);
            color: #fff;
        }

        /* Modal para Ver Imágenes en Pantalla Completa */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            display: grid;
            place-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
        }

        @media(max-width: 600px) {
            .container { width: 100%; margin: 0; }
            .chat-card { height: calc(100vh - 72px); border-radius: 0; border: 0; }
            .message { max-width: 88%; }
            .attach-menu { left: 10px; right: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-mark">TA</div>
        TuAuto P2P 2026
    </div>
    <div class="user-tag" onclick="changeNickname()" title="Hacé clic para cambiar tu apodo">
        <div class="status-dot" id="statusDot"></div>
        <span id="displayUser">Cargando ID...</span> ✏️
    </div>
</header>

<main class="container">
    <div class="chat-card">
        <div class="chat-header">
            <h2>🌐 Sala P2P Automática</h2>
            <span class="net-status" id="netStatus">Iniciando protocolo P2P...</span>
        </div>

        <div class="messages-container" id="messagesList">
            <div class="message system">⚡ Red global activa. Cualquier dispositivo que abra este link se conectará en tiempo real sin registro.</div>
        </div>

        <div class="chat-input-wrapper">
            <!-- Menú Flotante de Adjuntos Minimalista 2026 -->
            <div class="attach-menu" id="attachMenu">
                <div class="attach-item" onclick="triggerFileInput('image/*')">
                    <div class="attach-icon">🖼️</div>
                    <span>Foto / Imagen</span>
                </div>
                <div class="attach-item" onclick="triggerFileInput('video/*')">
                    <div class="attach-icon">🎥</div>
                    <span>Video HD</span>
                </div>
                <div class="attach-item" onclick="triggerFileInput('*/*')">
                    <div class="attach-icon">📄</div>
                    <span>Documento / Archivo</span>
                </div>
            </div>

            <!-- Interfaz de Grabación de Nota de Voz -->
            <div class="voice-rec-bar" id="voiceRecBar">
                <div class="rec-dot"></div>
                <div class="rec-timer" id="recTimer">00:00</div>
                <canvas class="wave-canvas" id="waveCanvas"></canvas>
                <button class="btn-cancel-rec" onclick="cancelVoiceRecording()">Cancelar</button>
                <button class="action-btn" style="background: var(--orange); color: #fff; border: 0;" onclick="stopAndSendVoice()">➔</button>
            </div>

            <!-- Barra de Texto y Acciones Principal -->
            <form class="chat-input-area" onsubmit="sendMessage(event)">
                <button type="button" class="action-btn" onclick="toggleAttachMenu()" title="Adjuntar multimedia">+</button>
                <button type="button" class="action-btn" onclick="startVoiceRecording()" title="Grabar nota de voz">🎙️</button>
                
                <input type="text" id="msgInput" placeholder="Escribí un mensaje..." autocomplete="off" disabled required>
                <button type="submit" class="btn-send" id="sendBtn" disabled>Enviar</button>
            </form>
        </div>
    </div>
</main>

<!-- Inputs de archivo ocultos -->
<input type="file" id="hiddenFileInput" style="display: none;" onchange="handleFileSelected(event)">

<!-- Modal Visor de Fotos en Pantalla Completa -->
<div class="modal-overlay" id="imgModal" onclick="closeModal()">
    <img src="" class="modal-img" id="modalImg">
</div>

<script>
    // Configuración Inicial de Apodo
    let myUser = localStorage.getItem('tuauto_nick_2026');
    if (!myUser) {
        myUser = "Usuario_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('tuauto_nick_2026', myUser);
    }
    document.getElementById('displayUser').innerText = myUser;

    function changeNickname() {
        const nuevo = prompt("Elegí tu nuevo apodo para el chat P2P:", myUser);
        if (nuevo && nuevo.trim() !== "") {
            const old = myUser;
            myUser = nuevo.trim();
            localStorage.setItem('tuauto_nick_2026', myUser);
            document.getElementById('displayUser').innerText = myUser;
            broadcastData({ type: 'system', text: `🔄 ${old} ahora se llama ${myUser}` });
        }
    }

    // Lógica de Red P2P Automática
    const MASTER_ROOM_ID = "tuauto-global-mesh-room-2026";
    let peer = null;
    let activeConns = [];
    let isHost = false;

    // Configuración ICE/STUN universal para evitar bloqueos en iFrames y Canvas
    const peerConfig = {
        debug: 1,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    };

    function initP2PMesh() {
        try {
            // Attempt standard PeerJS connection
            peer = new Peer(MASTER_ROOM_ID, peerConfig);

            peer.on('open', (id) => {
                isHost = true;
                updateStatus("🟢 Sala Activa (Anfitrión)", true);
                addSystemMsg("🟢 Conectado como nodo principal P2P.");
                enableInputs(true);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Host exists, connect as peer client
                    isHost = false;
                    try {
                        peer = new Peer(peerConfig);
                        peer.on('open', () => {
                            const conn = peer.connect(MASTER_ROOM_ID);
                            setupConnection(conn);
                            updateStatus("🟢 Conectado en Vivo", true);
                            addSystemMsg("🟢 Te uniste a la sala global automáticamente.");
                            enableInputs(true);
                        });
                        peer.on('error', () => fallbackLocalMode("Servidor P2P no disponible"));
                    } catch (e) {
                        fallbackLocalMode("Entorno restringido");
                    }
                } else {
                    console.warn("PeerJS aviso:", err);
                    fallbackLocalMode(err.message || "Modo Vista Previa");
                }
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
                addSystemMsg("📱 Un nuevo dispositivo ingresó a la sala.");
            });
        } catch (e) {
            console.warn("Error WebSocket/PeerJS en entorno sandbox:", e);
            fallbackLocalMode("Vista previa local activada");
        }
    }

    // Fallback cuando WebSockets están bloqueados por políticas de seguridad de iframe/canvas
    function fallbackLocalMode(reason) {
        updateStatus("🟡 Modo Local / Demo", true);
        addSystemMsg(`⚠️ ${reason}. La interfaz multimedia (notas de voz, fotos y archivos) está lista para probar localmente.`);
        enableInputs(true);
    }

    function setupConnection(conn) {
        if (!activeConns.includes(conn)) {
            activeConns.push(conn);
        }

        conn.on('data', (data) => {
            handleIncomingData(data);

            // Si somos Host, retrasmitimos la carga útil a todos los demás pares
            if (isHost) {
                activeConns.forEach(c => {
                    if (c !== conn && c.open) c.send(data);
                });
            }
        });

        conn.on('close', () => {
            activeConns = activeConns.filter(c => c !== conn);
        });
    }

    function broadcastData(dataObj) {
        activeConns.forEach(c => {
            if (c.open) c.send(dataObj);
        });
    }

    function handleIncomingData(data) {
        if (data.type === 'chat') {
            appendMessage(data.user, data.text, false, data.time);
        } else if (data.type === 'media') {
            appendMediaMessage(data.user, data.mediaType, data.fileData, data.fileName, false, data.time);
        } else if (data.type === 'system') {
            addSystemMsg(data.text);
        }
    }

    // Envío de Mensaje de Texto Normal
    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text) {
            const timeStr = getFormattedTime();
            const payload = { type: 'chat', user: myUser, text: text, time: timeStr };

            broadcastData(payload);
            appendMessage(myUser, text, true, timeStr);
            input.value = '';
        }
    }

    // Menú de Adjuntos y Manejo de Archivos
    function toggleAttachMenu() {
        document.getElementById('attachMenu').classList.toggle('active');
    }

    function triggerFileInput(acceptType) {
        document.getElementById('attachMenu').classList.remove('active');
        const fileInput = document.getElementById('hiddenFileInput');
        fileInput.accept = acceptType;
        fileInput.click();
    }

    function handleFileSelected(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Limite de tamaño para P2P liviano (15MB)
        if (file.size > 15 * 1024 * 1024) {
            alert("El archivo supera el límite recomendado de 15MB para transferencia P2P instantánea.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
            const base64Data = evt.target.result;
            let mediaType = 'file';

            if (file.type.startsWith('image/')) mediaType = 'image';
            else if (file.type.startsWith('video/')) mediaType = 'video';
            else if (file.type.startsWith('audio/')) mediaType = 'audio';

            const timeStr = getFormattedTime();
            const payload = {
                type: 'media',
                mediaType: mediaType,
                user: myUser,
                fileData: base64Data,
                fileName: file.name,
                time: timeStr
            };

            broadcastData(payload);
            appendMediaMessage(myUser, mediaType, base64Data, file.name, true, timeStr);
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    // Lógica de Grabación de Notas de Voz e Hidratación del Micrófono
    let mediaRecorder = null;
    let audioChunks = [];
    let recInterval = null;
    let secondsRecorded = 0;
    let audioCtx = null;
    let analyser = null;
    let animFrame = null;

    async function startVoiceRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('voiceRecBar').classList.add('active');
            
            audioChunks = [];
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();

            // Temporizador
            secondsRecorded = 0;
            document.getElementById('recTimer').innerText = "00:00";
            recInterval = setInterval(() => {
                secondsRecorded++;
                const mins = Math.floor(secondsRecorded / 60).toString().padStart(2, '0');
                const secs = (secondsRecorded % 60).toString().padStart(2, '0');
                document.getElementById('recTimer').innerText = `${mins}:${secs}`;
            }, 1000);

            // Visualizador en tiempo real (Waveform Canvas)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 64;

            drawWaveform();

        } catch (err) {
            alert("No se pudo acceder al micrófono. Verificá los permisos de tu navegador.");
        }
    }

    function drawWaveform() {
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function render() {
            animFrame = requestAnimationFrame(render);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 1.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                ctx.fillStyle = '#c96c02';
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }
        render();
    }

    function cancelVoiceRecording() {
        cleanupVoiceRec();
    }

    function stopAndSendVoice() {
        if (!mediaRecorder) return;

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Audio = reader.result;
                const timeStr = getFormattedTime();

                const payload = {
                    type: 'media',
                    mediaType: 'audio',
                    user: myUser,
                    fileData: base64Audio,
                    fileName: 'Nota_de_voz.webm',
                    time: timeStr
                };

                broadcastData(payload);
                appendMediaMessage(myUser, 'audio', base64Audio, 'Nota_de_voz.webm', true, timeStr);
            };
            reader.readAsDataURL(audioBlob);
            cleanupVoiceRec();
        };

        mediaRecorder.stop();
    }

    function cleanupVoiceRec() {
        if (mediaRecorder && mediaRecorder.stream) {
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
        clearInterval(recInterval);
        cancelAnimationFrame(animFrame);
        if (audioCtx) audioCtx.close();

        document.getElementById('voiceRecBar').classList.remove('active');
        mediaRecorder = null;
    }

    // Renderizado de Mensajes en el DOM
    function appendMessage(user, text, isMine, time) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'mine' : 'other'}`;
        msgDiv.innerHTML = `
            <span class="meta">${escapeHTML(user)}</span>
            ${escapeHTML(text)}
            <span class="time">${time}</span>
        `;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function appendMediaMessage(user, mediaType, fileData, fileName, isMine, time) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'mine' : 'other'}`;

        let mediaHtml = '';

        if (mediaType === 'image') {
            mediaHtml = `<img src="${fileData}" class="chat-media-img" onclick="openModal('${fileData}')" title="Clic para ampliar">`;
        } else if (mediaType === 'video') {
            mediaHtml = `<video src="${fileData}" controls class="chat-media-video"></video>`;
        } else if (mediaType === 'audio') {
            mediaHtml = `
                <div class="audio-player-box">
                    <button class="audio-play-btn" onclick="togglePlayAudio(this)">▶</button>
                    <div class="audio-wave-visual">
                        <div class="wave-bar" style="height:40%"></div>
                        <div class="wave-bar" style="height:80%"></div>
                        <div class="wave-bar" style="height:60%"></div>
                        <div class="wave-bar" style="height:100%"></div>
                        <div class="wave-bar" style="height:50%"></div>
                    </div>
                    <audio src="${fileData}" onended="resetAudioBtn(this)"></audio>
                </div>
            `;
        } else {
            mediaHtml = `
                <a href="${fileData}" download="${fileName}" class="chat-file-card">
                    <div class="file-icon-box">📎</div>
                    <div>
                        <div style="font-weight:700; font-size:13px;">${escapeHTML(fileName)}</div>
                        <div style="font-size:10px; opacity:0.7;">Clic para descargar</div>
                    </div>
                </a>
            `;
        }

        msgDiv.innerHTML = `
            <span class="meta">${escapeHTML(user)}</span>
            ${mediaHtml}
            <span class="time">${time}</span>
        `;

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    // Controles de Audio y Modales
    function togglePlayAudio(btn) {
        const audio = btn.parentElement.querySelector('audio');
        if (audio.paused) {
            audio.play();
            btn.innerText = '⏸';
        } else {
            audio.pause();
            btn.innerText = '▶';
        }
    }

    function resetAudioBtn(audio) {
        const btn = audio.parentElement.querySelector('.audio-play-btn');
        if (btn) btn.innerText = '▶';
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imgModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('imgModal').classList.remove('active');
    }

    function addSystemMsg(text) {
        const container = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message system';
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function updateStatus(text, isOnline) {
        const dot = document.getElementById('statusDot');
        const label = document.getElementById('netStatus');
        if (isOnline) dot.classList.add('online');
        else dot.classList.remove('online');
        label.innerText = text;
    }

    function enableInputs(enable) {
        document.getElementById('msgInput').disabled = !enable;
        document.getElementById('sendBtn').disabled = !enable;
    }

    function getFormattedTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }

    // Inicialización al Cargar
    window.onload = initP2PMesh;
</script>
